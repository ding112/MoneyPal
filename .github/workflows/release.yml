name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-main
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: npm-publish
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          registry-url: https://registry.npmjs.org/

      - name: Install npm per packageManager
        run: npm install -g npm@11.14.1

      - name: Install dependencies
        run: npm ci

      - name: Determine release state
        run: |
          version="$(jq -r .version package.json)"
          echo "VERSION=$version" >> "$GITHUB_ENV"
          if git rev-parse -q --verify "refs/tags/v$version" >/dev/null 2>&1; then
            echo "::notice::tag v$version 已存在，视为已发布，本次跳过"
            echo "SKIP=true" >> "$GITHUB_ENV"
          else
            echo "SKIP=false" >> "$GITHUB_ENV"
          fi

      - name: Release test gates
        if: env.SKIP != 'true'
        run: npm run test:release

      - name: Release preflight
        if: env.SKIP != 'true'
        run: npm run release:preflight

      - name: Publish dsh-moneypal
        if: env.SKIP != 'true'
        run: |
          if npm view "dsh-moneypal@$VERSION" version >/dev/null 2>&1; then
            echo "::notice::dsh-moneypal@$VERSION 已在 registry，跳过发布"
          else
            npm run publish:dsh
          fi
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Publish mcp-moneypal
        if: env.SKIP != 'true'
        run: |
          if npm view "mcp-moneypal@$VERSION" version >/dev/null 2>&1; then
            echo "::notice::mcp-moneypal@$VERSION 已在 registry，跳过发布"
          else
            npm run publish:mcp
          fi
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Stage release artifacts
        if: env.SKIP != 'true'
        run: |
          mkdir -p release-artifacts
          npm pack ./dist/packages/dsh-moneypal --pack-destination release-artifacts
          npm pack ./dist/packages/mcp-moneypal --pack-destination release-artifacts
          cp dist/experts/moneypal.zip release-artifacts/

      - name: Create GitHub Release
        if: env.SKIP != 'true'
        run: gh release create "v$VERSION" --target "$GITHUB_SHA" --generate-notes --title "v$VERSION" release-artifacts/*
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload release artifacts
        if: env.SKIP != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: release-artifacts-v${{ env.VERSION }}
          path: release-artifacts/
