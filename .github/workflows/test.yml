name: Test

on:
  push:
    branches: [main]
    paths-ignore:
      - "**/*.md"
      - "docs/**"
  pull_request:
    types: [opened, synchronize, reopened]
    paths-ignore:
      - "**/*.md"
      - "docs/**"

permissions:
  contents: read

concurrency:
  # PR 共享组，main 的每次运行使用独立组，避免排队的提交也被替换。
  group: test-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          cache: npm

      - name: Install npm per packageManager
        run: npm install -g npm@11.14.1 --prefer-offline

      - name: Install dependencies
        run: npm ci --prefer-offline

      - name: Build once
        run: npm run build

      - name: Identify Python runtime
        id: python
        run: echo "version=$(python3 --version | cut -d' ' -f2)" >> "$GITHUB_OUTPUT"

      - name: Cache MoneyPal runtime
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: ~/.local/share/moneypal/runtime
          key: moneypal-runtime-v1-${{ runner.os }}-${{ runner.arch }}-${{ steps.python.outputs.version }}-${{ hashFiles('core-source.json') }}

      - name: Prepare MoneyPal runtime
        env:
          MONEYPAL_PYPI_INDEX_URL: https://pypi.org/simple
        run: node dist/src/main.js setup-runtime

      - name: Release gates
        run: npm run verify:release:built
