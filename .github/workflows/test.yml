name: Test

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          cache: npm

      - name: Install npm per packageManager
        run: npm install -g npm@11.14.1

      - name: Install dependencies
        run: npm ci

      - name: Build once
        run: npm run build

      - name: Prepare MoneyPal runtime
        run: node dist/src/main.js setup-runtime

      - name: Release gates
        run: npm run verify:release:built
