name: Test

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, edited]

permissions:
  contents: read

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          cache: npm

      - name: Install npm per packageManager
        run: npm install -g npm@11.14.1

      - name: Install dependencies
        run: npm ci

      - name: Check pull request title
        if: github.event_name == 'pull_request'
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          node -e '
            const pattern = /^(feat|fix|docs|refactor|perf|test|build|ci|chore|revert)(\([^()]*\))?!?: .+/u;
            const title = process.env.PR_TITLE ?? "";
            if (!pattern.test(title)) {
              console.log("::error::PR 标题必须符合 Conventional Commits（例如 fix(ci): 说明），当前标题不匹配。");
              process.exit(1);
            }
            console.log("PR 标题格式通过。");
          '

      - name: Prepare MoneyPal runtime
        run: npm run build:base && node dist/src/main.js setup-runtime

      - name: Release gates
        run: npm run test:release
